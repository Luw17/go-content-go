services:
  cms:
    build:
      context: .
      dockerfile: Dockerfile
    image: go-content-go:latest
    restart: unless-stopped
    ports:
      - "${GCG_PORT:-${GO_CONTENT_GO_PORT:-8080}}:8080"
    volumes:
      - cms-data:/app/data
      - cms-uploads:/app/uploads
      - cms-backups:/app/backups
      - cms-themes:/app/themes
      - cms-plugins:/app/plugins
    environment:
      GCG_ADDR: ":8080"
      GCG_DB: /app/data/go-content-go.db
      GCG_UPLOADS: /app/uploads
      GCG_BACKUPS: /app/backups
      GCG_BACKUP_RETENTION: ${GCG_BACKUP_RETENTION:-${GO_CONTENT_GO_BACKUP_RETENTION:-10}}
      GCG_API_RATE_LIMIT: ${GCG_API_RATE_LIMIT:-${GO_CONTENT_GO_API_RATE_LIMIT:-60}}
      GCG_TRUSTED_PROXIES: ${GCG_TRUSTED_PROXIES:-${GO_CONTENT_GO_TRUSTED_PROXIES:-}}
      GCG_THEMES: /app/themes
      GCG_PLUGINS: /app/plugins

volumes:
  cms-data:
  cms-uploads:
  cms-backups:
  cms-themes:
  cms-plugins:
