<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | Go Content Go!</title>
    <link rel="icon" type="image/svg+xml" href="/static/brand/gcg-icon.svg">
    <link rel="stylesheet" href="/static/style.css?v={{staticVersion "style.css"}}">
  </head>
  <body>
    <main class="auth-card">
      <div class="auth-brand">
        <img class="auth-logo" src="/static/brand/gcg-logo-light.svg" alt="Go Content Go">
      </div>
      <p class="eyebrow">Área administrativa</p>
      <h1>Entrar</h1>
      {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
      <form method="post" action="/admin/login">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <label for="username">Nome de usuário</label>
        <input id="username" name="username" type="text" autocomplete="username"
          value="{{.Username}}" required>
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <label for="totp_code">Código 2FA ou de recuperação {{if not .RequireTOTP}}<span class="muted">(se ativado)</span>{{end}}</label>
        <input id="totp_code" name="totp_code" type="text" autocomplete="one-time-code"
          maxlength="20" placeholder="000000 ou XXXXX-XXXXX" {{if .RequireTOTP}}required{{end}}>
        <button type="submit">Entrar</button>
      </form>
    </main>
  </body>
</html>
