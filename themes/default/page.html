<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="{{.Item.Summary}}">
    <title>{{.Item.Title}} | Go Content Go!</title>
    <link rel="stylesheet" href="/themes/{{.Theme}}/style.css">
    {{.HeadTags}}
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Go Content Go! — início">Go Content Go<span>!</span></a>
      <nav class="site-nav" aria-label="Navegação principal">
        <a href="/">Início</a>
      </nav>
    </header>
    <main class="site-main reading-main">
      <a class="back-link" href="/">← Voltar para o início</a>
      <article class="article">
        <header class="article-header page-header">
          <p class="eyebrow">Página</p>
          <h1>{{.Item.Title}}</h1>
        </header>
        {{if .Item.FeaturedImage}}
          <figure class="article-cover">
            <img src="{{.Item.FeaturedImage}}" alt="" fetchpriority="high">
          </figure>
        {{end}}
        <div class="article-content">{{.Item.HTML}}</div>
      </article>
    </main>
    <footer class="site-footer">
      <a class="brand brand-small" href="/">Go Content Go<span>!</span></a>
      <p>Feito para publicar com simplicidade.</p>
    </footer>
  </body>
</html>
